services:
  render:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_BASE: https://${DOMAIN}
    volumes:
      - ./data:/data
      - ./assets:/app/assets
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
